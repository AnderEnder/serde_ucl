# A release, on a pushed tag vX.Y.Z. The jobs run in order, and each starts only if the ones
# before it passed, so nothing is published when a check fails:
#
#   version         scripts/ci.sh release: the tag is vX.Y.Z for the version in Cargo.toml, and
#                   CHANGELOG.md has a section for it
#   checks          ci.yml, that is scripts/ci.sh, on Linux and macOS
#   c-source        build one source archive and test a clean extracted-source install
#   c-distribution  native Linux amd64/arm64 + macOS arm64 reference gates and verified SDKs
#   c-artifacts     require all four archives from the same tested commit; combine checksums
#   publish         cargo publish, with a short-lived crates.io token from Trusted Publishing;
#                   skipped with a notice when crates.io has the version already, so that the
#                   workflow can be run again
#   github-release  the GitHub release for the tag, with the version's CHANGELOG.md section as
#                   its notes; existing notes are preserved and C attachments are refreshed
#
# Publishing uses crates.io Trusted Publishing: no crates.io token is stored in the repository.
# The publish job runs in the GitHub environment `release` and asks GitHub for an OIDC token
# (`id-token: write`), which rust-lang/crates-io-auth-action exchanges for a crates.io token that
# lasts for the job. It works only once the crate exists on crates.io and names this workflow as
# its trusted publisher, in the crate's settings on crates.io, Trusted Publishing, GitHub:
# repository owner `AnderEnder`, repository `serde_ucl`, workflow filename `release.yml`,
# environment `release`. GitHub creates the environment on first use; creating it beforehand in
# the repository's settings lets it be limited to `v*` tags or require an approval.
#
# The jobs that publish use no cache, so what they publish is built from the tagged commit alone.
name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  version:
    name: tag and version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - name: scripts/ci.sh release
        run: scripts/ci.sh release "$GITHUB_REF_NAME"

  checks:
    needs: version
    uses: ./.github/workflows/ci.yml

  c-source:
    name: verified C source archive
    needs: checks
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools, rust-docs
      - name: scripts/ci.sh release
        run: scripts/ci.sh release "$GITHUB_REF_NAME"
      - name: Verify native source-test runner
        run: python3 capi/distribution.py --assert-native --target macos-arm64
      - name: Install pinned cargo-c
        run: cargo install cargo-c --version 0.10.25+cargo-0.99.0 --locked
      - name: Build source archive once and verify clean source installation
        run: python3 capi/distribution.py --kind source --target macos-arm64 --verify --require-clean --output target/c-source
      - uses: actions/upload-artifact@v4
        with:
          name: serde-ucl-capi-input-source
          path: target/c-source/*
          if-no-files-found: error
          overwrite: true

  c-distribution:
    name: verified C SDK (${{ matrix.target }})
    needs: checks
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-amd64
            runner: ubuntu-24.04
            shared: libucl.so
          - target: linux-arm64
            runner: ubuntu-24.04-arm
            shared: libucl.so
          - target: macos-arm64
            runner: macos-15
            shared: libucl.dylib
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools, rust-docs
      - name: scripts/ci.sh release
        run: scripts/ci.sh release "$GITHUB_REF_NAME"
      - name: Verify native OS and architecture
        env:
          SDK_TARGET: ${{ matrix.target }}
        run: python3 capi/distribution.py --assert-native --target "$SDK_TARGET"
      - name: Install native Linux build and reference dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y build-essential binutils pkg-config cmake libssl-dev
      - name: Install pinned cargo-c
        run: cargo install cargo-c --version 0.10.25+cargo-0.99.0 --locked
      - name: Stage native candidate for reference verification
        env:
          SDK_TARGET: ${{ matrix.target }}
        run: python3 capi/distribution.py --build-only --target "$SDK_TARGET" --candidate-prefix "$PWD/target/c-candidate" --require-clean
      - name: Native black-box reference compatibility gate
        env:
          SDK_SHARED: ${{ matrix.shared }}
        run: |
          python3 tools/capi-conformance/ci.py \
            --candidate-include target/c-candidate/include \
            --candidate-library target/c-candidate/lib/libucl.a \
            --candidate-library "target/c-candidate/lib/$SDK_SHARED" \
            --work-dir target/c-oracle \
            --golden-dir target/c-oracle/golden
      - name: Package and verify extracted relocated native SDK and source build
        env:
          SDK_TARGET: ${{ matrix.target }}
        run: |
          python3 capi/distribution.py --kind sdk --target "$SDK_TARGET" \
            --candidate-prefix target/c-candidate \
            --golden-dir target/c-oracle/golden \
            --verify --require-clean --output target/c-sdk
      - uses: actions/upload-artifact@v4
        with:
          name: serde-ucl-capi-input-sdk-${{ matrix.target }}
          path: target/c-sdk/*
          if-no-files-found: error
          overwrite: true

  c-artifacts:
    name: validate and consolidate C release artifacts
    needs: [c-source, c-distribution]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          pattern: serde-ucl-capi-input-*
          merge-multiple: true
          path: target/c-incoming
      - name: Require source and all SDKs from this version and commit
        run: python3 capi/collect_distribution.py --input target/c-incoming --output target/c-dist --commit "$GITHUB_SHA"
      - uses: actions/upload-artifact@v4
        with:
          name: serde-ucl-capi-distribution
          path: target/c-dist/*
          if-no-files-found: error
          overwrite: true

  publish:
    needs: [checks, c-artifacts]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - name: scripts/ci.sh release
        run: scripts/ci.sh release "$GITHUB_REF_NAME"
      - name: Is the version on crates.io
        id: published
        run: |
          name=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].name')
          version=${GITHUB_REF_NAME#v}
          # The crate's file in the sparse index lists every published version, one JSON object
          # per line.
          lower=$(printf '%s' "$name" | tr '[:upper:]' '[:lower:]')
          case ${#lower} in
          1) path=1/$lower ;;
          2) path=2/$lower ;;
          3) path=3/${lower:0:1}/$lower ;;
          *) path=${lower:0:2}/${lower:2:2}/$lower ;;
          esac
          if curl -fsSL "https://index.crates.io/$path" 2>/dev/null |
            jq -e --arg v "$version" 'select(.vers == $v)' >/dev/null; then
            echo "::notice title=Not published::crates.io already has $name $version; nothing to publish."
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - name: crates.io token (Trusted Publishing)
        if: steps.published.outputs.exists == 'false'
        id: auth
        uses: rust-lang/crates-io-auth-action@v1
      - name: Publish to crates.io
        if: steps.published.outputs.exists == 'false'
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: cargo publish --locked

  github-release:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - name: scripts/ci.sh release
        run: scripts/ci.sh release "$GITHUB_REF_NAME"
      - uses: actions/download-artifact@v4
        with:
          name: serde-ucl-capi-distribution
          path: target/c-dist
      - name: Create the GitHub release and attach C artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "::notice title=GitHub release::A release for $GITHUB_REF_NAME exists already; preserving its notes."
          else
            gh release create "$GITHUB_REF_NAME" --verify-tag --title "$GITHUB_REF_NAME" \
              --notes-file target/release-notes.md
          fi
          (cd target/c-dist && shasum -a 256 -c SHA256SUMS)
          gh release upload "$GITHUB_REF_NAME" target/c-dist/* --clobber
