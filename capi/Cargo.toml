[package]
name = "serde-ucl-capi"
version = "0.6.0"
edition = "2024"
rust-version = "1.99"
license = "MIT OR Apache-2.0"
description = "Stage A read-only C ABI for serde_ucl"
publish = false

[workspace]

[lib]
name = "ucl"
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
serde_ucl = { path = "..", features = ["load"] }
libc = "0.2"

[profile.release]
lto = "fat"
codegen-units = 1

# Opt-in C distribution; Rust package version and shared ABI evolve independently.
[features]
capi = []

[package.metadata.capi]
min_version = "0.10.25"

[package.metadata.capi.header]
enabled = true
generation = false
emit_version_constants = false
subdirectory = ""

[package.metadata.capi.install.include]
asset = [{ from = "include/ucl.h", to = "" }]

[package.metadata.capi.pkg_config]
name = "serde-ucl"
filename = "serde-ucl"

[package.metadata.capi.library]
name = "ucl"
version = "1.0.0"
version_suffix_components = 1
