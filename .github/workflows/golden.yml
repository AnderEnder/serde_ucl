# Nightly drift check: builds libucl at the pinned commit with scripts/regen-golden.sh, as a
# developer would, regenerates every golden file, and fails with the diff if any file changed
# (scripts/ci.sh golden). It runs on Linux and on macOS. The golden files next to the cases come
# from macOS; the few cases whose results depend on the C library have each other platform's
# results under tests/conformance/platform/<platform>/, and on that platform the check compares
# with those (tests/conformance/README.md, "Golden files per platform").
name: Golden files

on:
  schedule:
    - cron: "30 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  drift:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: scripts/ci.sh golden
        run: scripts/ci.sh golden
