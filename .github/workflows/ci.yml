# Runs scripts/ci.sh, the checks a developer runs locally before pushing, on Linux and macOS
# with stable Rust and with the crate's rust-version from Cargo.toml.
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  checks:
    name: ${{ matrix.os }}, ${{ matrix.rust }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        rust: [stable, rust-version]
    steps:
      - uses: actions/checkout@v5
      - name: Toolchain version
        id: toolchain
        env:
          RUST: ${{ matrix.rust }}
        run: |
          if [ "$RUST" = rust-version ]; then
            version=$(sed -n 's/^rust-version = "\(.*\)"$/\1/p' Cargo.toml)
            test -n "$version"
          else
            version=$RUST
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.toolchain.outputs.version }}
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: scripts/ci.sh
        run: scripts/ci.sh
