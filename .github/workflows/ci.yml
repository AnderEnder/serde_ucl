# Runs scripts/ci.sh, the checks a developer runs locally before pushing, on Linux and macOS
# with stable Rust. The crate targets the latest stable Rust (rust-version in Cargo.toml), so
# there is no separate job for an older toolchain. release.yml calls this workflow for its checks.
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  checks:
    name: ${{ matrix.os }}, stable
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt, llvm-tools
      - uses: Swatinem/rust-cache@v2
      - name: Install pinned cargo-c
        # The cache can restore a binary built on another runner image, linked against a
        # library this image lacks; `cargo install` then skips it as installed. Rebuild it.
        run: |
          cargo install cargo-c --version 0.10.25+cargo-0.99.0 --locked
          cargo cinstall --version > /dev/null ||
            cargo install cargo-c --version 0.10.25+cargo-0.99.0 --locked --force
      - name: scripts/ci.sh
        run: scripts/ci.sh
