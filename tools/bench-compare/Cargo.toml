[package]
name = "bench-compare"
version = "0.0.0"
edition = "2024"
publish = false
description = "Times serde_ucl against serde_json on the benchmarks' documents; scripts/bench-compare.sh adds libucl"

# Not a member of the crate's workspace.
[workspace]

[dependencies]
serde_ucl = { path = "../.." }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# The crate's release settings (Cargo.toml).
[profile.release]
lto = "fat"
codegen-units = 1
