[package]
name = "ucl-rust-lexer"
version = "0.1.0"
edition = "2024"
# The lowest Rust version the crate builds with: let chains need 1.88.
rust-version = "1.88"
authors = ["Andrii Radyk"]
description = "UCL (Universal Configuration Language) with serde: reads and writes UCL as libucl does"
license = "MIT OR Apache-2.0"
repository = "https://github.com/AnderEnder/ucl-rust-lexer"
readme = "README.md"
keywords = ["ucl", "libucl", "configuration", "serde", "parser"]
categories = ["config", "parser-implementations", "encoding"]
include = [
    "/src/**",
    "/Cargo.toml",
    "/README.md",
    "/CHANGELOG.md",
    "/LICENSE-MIT",
    "/LICENSE-APACHE",
]

[dependencies]
serde = { version = "1", features = ["derive"] }
thiserror = "1"
indexmap = { version = "2", features = ["serde"] }
smallvec = { version = "1", features = ["serde"] }

[dev-dependencies]
# `float_roundtrip`: tests compare the floats serde_json reads from the crate's JSON output by
# their bits (tests/serde_roundtrip.rs).
serde_json = { version = "1", features = ["float_roundtrip"] }
criterion = { version = "0.5", features = ["html_reports"] }
# The crate itself, with the default-off `load` feature, so that `cargo test` runs the `.load`
# conformance cases (clean-room work item C3b).
ucl-rust-lexer = { path = ".", features = ["load"] }

[features]
default = ["fs"]
# The filesystem loader for `.include` and `.load` (`parse::FsLoader`), and `from_file`.
fs = []
# The `.load` macro (spec §9.6); off by default. Without it, `.load` fails with the
# "unsupported" error (`ErrorKind::Unsupported`).
load = []

[lib]
name = "ucl_lexer"
path = "src/lib.rs"

[[bench]]
name = "parse_benchmarks"
harness = false

[[bench]]
name = "emit_benchmarks"
harness = false

[[bench]]
name = "serde_benchmarks"
harness = false

# Optimise the crate in test builds: the conformance and serde round-trip tests parse and write
# thousands of documents.
[profile.test.package.ucl-rust-lexer]
opt-level = 2
