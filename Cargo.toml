[package]
name = "serde_ucl"
version = "0.4.0"
edition = "2024"
# The crate targets the latest stable Rust (1.98 at this release); CI builds with stable only.
rust-version = "1.98"
authors = ["Andrii Radyk"]
description = "UCL (Universal Configuration Language) with serde: reads and writes UCL as libucl does"
license = "MIT OR Apache-2.0"
repository = "https://github.com/AnderEnder/serde_ucl"
homepage = "https://github.com/AnderEnder/serde_ucl"
documentation = "https://docs.rs/serde_ucl"
readme = "README.md"
keywords = ["ucl", "libucl", "configuration", "serde", "parser"]
categories = ["config", "parser-implementations", "encoding"]
include = [
    "/src/**",
    "/Cargo.toml",
    "/README.md",
    "/CHANGELOG.md",
    "/LICENSE-MIT",
    "/LICENSE-APACHE",
]

[dependencies]
serde = { version = "1", features = ["derive"] }
thiserror = "2"
# 2.2.2: the raw entry API (`RawEntryApiV1`, `index_from_hash`), with which a large object hashes
# a key once for its lookup and its insertion (src/value/map.rs, `Map::probe`).
indexmap = { version = "2.2.2", features = ["serde"] }
smallvec = { version = "1", features = ["serde"] }

[dev-dependencies]
# `float_roundtrip`: tests compare the floats serde_json reads from the crate's JSON output by
# their bits (tests/serde_roundtrip.rs).
serde_json = { version = "1", features = ["float_roundtrip"] }
criterion = { version = "0.8", features = ["html_reports"] }
# The crate itself, with the default-off `load` feature, so that `cargo test` runs the `.load`
# conformance cases (clean-room work item C3b). This turns `load` on for every test target; the
# package in tests/features/ tests the crate without it (scripts/ci.sh runs it).
serde_ucl = { path = ".", features = ["load"] }

[features]
default = ["fs"]
# The filesystem loader for `.include` and `.load` (`parse::FsLoader`), and `from_file`.
fs = []
# The `.load` macro (spec §9.6); off by default. Without it, `.load` fails with the
# "unsupported" error (`ErrorKind::Unsupported`).
load = []

[lib]
name = "serde_ucl"
path = "src/lib.rs"
# The library has no benchmarks of its own. Without this, `cargo bench` also runs the library's
# unit-test harness, which rejects the options of criterion, the harness of the benches in
# benches/ (`cargo bench -- --noplot`).
bench = false

[[bench]]
name = "parse_benchmarks"
harness = false

[[bench]]
name = "emit_benchmarks"
harness = false

[[bench]]
name = "serde_benchmarks"
harness = false

# Optimise the crate in test builds. This is for speed only: the serde round-trip, scaling and
# generated-document tests parse and write many documents, and run about five times faster this
# way. No test depends on it; they all pass unoptimised too, and scripts/ci.sh runs the
# stack-depth tests that way, as a debug build of an application builds the crate.
[profile.test.package.serde_ucl]
opt-level = 2

# Release builds of this package (its benches and examples; `cargo bench` inherits this) use fat
# LTO and one codegen unit: about 4-6% faster parsing. Crates that depend on this one build it
# with their own release profile.
[profile.release]
lto = "fat"
codegen-units = 1
